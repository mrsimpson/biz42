<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The biz42 model — twelve elements, one traceable chain</title>
    <meta
      name="description"
      content="The biz42 meta-model: twelve ISO 9001 element types, the fields that link them, notation and consistency rules."
    />
    <script>
      // Apply theme before React hydrates to avoid flash of wrong theme
      (function () {
        var stored = localStorage.getItem("theme");
        if (stored === "dark" || stored === "light") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/model.tsx"></script>
  </body>
</html>
